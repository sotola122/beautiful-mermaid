name: Publish guard

# This fork must not publish as unscoped `beautiful-mermaid` on npmjs.
# The published name is `@sotola122/beautiful-mermaid` on GitHub Packages
# (see package.json publishConfig). Releases from origin should not run the
# upstream public npm publish workflow.

on:
  release:
    types: [published]

jobs:
  skip-public-npm:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse unscoped npmjs publish
        run: |
          echo "Publish @sotola122/beautiful-mermaid via GitHub Packages."
          echo "Do not npm publish as unscoped beautiful-mermaid."
          exit 1
